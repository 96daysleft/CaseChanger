name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Git tag to check out and publish'
        required: true
        type: string

permissions:
  contents: write      # create GitHub release
  id-token: write      # required for keyless signing
  attestations: write  # required to publish attestation

jobs:
  build-publish:
    environment: release
    env:
      EXTENSION_NAME: casechanger.vsix
      SBOM_NAME: sbom.cdx.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Install VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libgtk-3-0t64 libgbm1 libasound2t64 libsecret-1-0

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package extension
        run: npx vsce package --out "${EXTENSION_NAME}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ env.SBOM_NAME }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: ${{ env.EXTENSION_NAME }}
          sbom-path: ${{ env.SBOM_NAME }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.EXTENSION_NAME }}

      - name: Publish to VS Code Marketplace
        if: ${{ vars.PUBLISH_VSCE == 'true'}}
        run: npx vsce publish --packagePath "${EXTENSION_NAME}" -p "${VSCE_PAT}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ vars.PUBLISH_VSX == 'true'}}
        run: npx ovsx publish "${EXTENSION_NAME}" -p "${OVSX_PAT}"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            "${EXTENSION_NAME}" \
            "${SBOM_NAME}"
