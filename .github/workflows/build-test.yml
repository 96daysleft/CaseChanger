name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the PR branch itself (not the detached merge ref) so we can push back.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Commit package-lock.json if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json unchanged"
            exit 0
          fi
          echo "package-lock.json changed - committing"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Run compile
        run: npm run compile

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Install VS Code test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libgtk-3-0t64 libgbm1 libasound2t64 libsecret-1-0

      - name: Run integration tests
        run: xvfb-run -a npm run test:integration

      - name: Fetch GitHub OIDC token and exchange for an Anthropic access token
        id: anthropic_token
        uses: actions/github-script@v9
        env:
          FEDERATION_RULE_ID: ${{ secrets.FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ secrets.SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
        with:
          script: |
            const jwt = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(jwt);

            const response = await fetch('https://api.anthropic.com/v1/oauth/token', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: jwt,
                federation_rule_id: process.env.FEDERATION_RULE_ID,
                organization_id: process.env.ORGANIZATION_ID,
                service_account_id: process.env.SERVICE_ACCOUNT_ID,
                workspace_id: process.env.WORKSPACE_ID,
              }),
            });

            if (!response.ok) {
              throw new Error(`Anthropic token exchange failed: ${response.status}`);
            }

            const { access_token: token } = await response.json();
            core.setSecret(token);
            core.setOutput('claude-token', token);

      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "anthropic/claude-haiku-4-5-20251001"
          config.fallback_models: '["anthropic/claude-sonnet-4-5-20250929"]'
          ANTHROPIC.KEY: ${{ steps.anthropic_token.outputs.claude-token }}
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"